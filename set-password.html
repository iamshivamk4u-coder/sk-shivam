<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Set your SkillLance account password." />
    <title>Set password — SkillLance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="auth-layout">
      <a class="auth-brand" href="index.html"><span>s</span>SkillLance</a>
      <section class="auth-card" aria-labelledby="password-title">
        <p class="eyebrow">ACCOUNT SECURITY</p>
        <h1 id="password-title">Create your <em>password.</em></h1>
        <p class="intro">Choose a strong password to protect your learner and affiliate dashboard.</p>
        <form id="set-password-form">
          <label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required /></label>
          <label>Confirm password<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your password" required /></label>
          <button type="submit">Save password <span>→</span></button>
          <p class="form-message" role="status" aria-live="polite" hidden></p>
        </form>
      </section>
    </main>
    <script type="module" src="auth.js"></script>
  </body>
</html>
